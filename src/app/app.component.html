<div class="drag w-screen h-screen p-4 grid grid-rows-[auto_1fr] gap-y-2 content-center">
  <p-toolbar class="drag">
    <ng-template #start>
      <span class="ml-4 font-bold text-2xl">Start Spring IO</span>
    </ng-template>
    <ng-template #center>
    </ng-template>
    <ng-template #end>

      <button pButton (click)="gitHub()" class="no-drag ml-auto  mr-2" severity="secondary" title="GitHub"><i class="pi pi-github"></i></button>
      <button pButton (click)="startDotSpringDotIo()" class="no-drag mr-2" severity="secondary" title="spring initializr"><img src="assets/icons/springinitializr.svg" width="16"/></button>
      <p-togglebutton class="no-drag mr-2"
                      [(ngModel)]="darkTheme"
                      [onLabel]="''"
                      [offLabel]="''"
                      [onIcon]="'pi pi-sun'"
                      [offIcon]="'pi pi-moon'">
      </p-togglebutton>
      <button pButton class="no-drag" severity="success" (click)="quit()" title="Quit"><i class="pi pi-times"></i></button>
    </ng-template>
  </p-toolbar>
  <webview id="start-spring-io" src="https://start.spring.io" class="no-drag border" partition="start-spring-io"></webview>
</div>
